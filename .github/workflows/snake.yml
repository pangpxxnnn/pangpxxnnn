name: Generate snake

on:
  schedule:
    - cron: "17 */12 * * *" # every 12 hours
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write # only needed to push the SVGs to the `output` branch

concurrency:
  group: snake
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build snake SVGs from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#302b63
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#00d4ff

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
